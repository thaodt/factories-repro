[workspace]
members = ["task-handle", "early-abort", "watch-race"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
# Every repro is pinned to the same upstream revision (deepslate-labs/factories
# `main` at the time of writing).
factories = { git = "https://github.com/deepslate-labs/factories", rev = "496923bccc3bcad6c84d27b9f037044e902b665c", default-features = false }

tokio = { version = "1.52.0", default-features = false }
# `factories_sync` expects the final binary to provide a critical-section
# implementation when the `std` feature of factories is off.
critical-section = { version = "1.2.0", features = ["std"] }
